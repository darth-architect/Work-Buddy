<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9333ea"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="560" fill="#ffffff"/>

  <text x="40" y="44" font-size="22" font-weight="700" fill="#0f172a">Password Reset — Architecture</text>
  <text x="40" y="68" font-size="13" fill="#64748b">AI chatbot · mobile + OTP identity verification · Microsoft Graph · Azure AD</text>

  <rect x="40" y="150" width="190" height="90" rx="12" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
  <text x="135.0" y="190.5" font-size="16" fill="#0c4a6e" text-anchor="middle" font-weight="700">User</text>
  <text x="135.0" y="207.5" font-size="12" fill="#0c4a6e" text-anchor="middle">via AI chatbot</text>
  <rect x="300" y="130" width="230" height="130" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="415.0" y="182.0" font-size="14" fill="#92400e" text-anchor="middle" font-weight="700">Identity Verification</text>
  <text x="415.0" y="199.0" font-size="11" fill="#92400e" text-anchor="middle">mobile number vs Azure AD</text>
  <text x="415.0" y="216.0" font-size="11" fill="#92400e" text-anchor="middle">+ OTP via Twilio Verify</text>
  <rect x="610" y="150" width="230" height="90" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="725.0" y="190.5" font-size="14" fill="#14532d" text-anchor="middle" font-weight="700">Microsoft Graph API</text>
  <text x="725.0" y="207.5" font-size="11" fill="#14532d" text-anchor="middle" font-family="monospace">PATCH /users/{id}</text>
  <rect x="920" y="150" width="220" height="90" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="1030.0" y="182.0" font-size="16" fill="#14532d" text-anchor="middle" font-weight="700">Azure AD</text>
  <text x="1030.0" y="199.0" font-size="11" fill="#14532d" text-anchor="middle">password reset +</text>
  <text x="1030.0" y="216.0" font-size="11" fill="#14532d" text-anchor="middle">force change at next sign-in</text>
  <line x1="230" y1="195" x2="298" y2="195" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="530" y1="195" x2="608" y2="195" stroke="#d97706" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <text x="569" y="182" font-size="10" fill="#d97706" text-anchor="middle">OTP valid</text>
  <line x1="840" y1="195" x2="918" y2="195" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <text x="40" y="350" font-size="13" font-weight="700" fill="#0f172a">Verification before any change</text>
  <text x="40" y="372" font-size="12" fill="#334155">The bot never resets a password on a chat message alone -- the mobile number must match</text>
  <text x="40" y="392" font-size="12" fill="#334155">the Azure AD record, and the Twilio OTP must be entered correctly.</text>
  <text x="40" y="436" font-size="13" font-weight="700" fill="#0f172a">Self-service, not a ticket</text>
  <text x="40" y="458" font-size="12" fill="#334155">Password resets are high-volume and low-risk once identity is confirmed, so this flow</text>
  <text x="40" y="478" font-size="12" fill="#334155">skips the service desk entirely and resets directly via Microsoft Graph.</text>

  <!-- Footer -->
  <line x1="40" y1="508" x2="1140" y2="508" stroke="#e2e8f0" stroke-width="1"/>
  <text x="40" y="530" font-size="11" fill="#94a3b8">Work Buddy · workflows/password-reset/architecture.svg</text>
</svg>
