<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9333ea"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="560" fill="#ffffff"/>

  <text x="40" y="44" font-size="22" font-weight="700" fill="#0f172a">Distribution List Management — Architecture</text>
  <text x="40" y="68" font-size="13" fill="#64748b">AI chatbot · owner-based RBAC · conditional approval · Microsoft Graph · Azure Entra ID</text>

  <rect x="40" y="150" width="180" height="90" rx="12" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
  <text x="130.0" y="190.5" font-size="16" fill="#0c4a6e" text-anchor="middle" font-weight="700">User</text>
  <text x="130.0" y="207.5" font-size="12" fill="#0c4a6e" text-anchor="middle">via AI chatbot</text>
  <rect x="260" y="150" width="210" height="90" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="365.0" y="190.5" font-size="14" fill="#334155" text-anchor="middle" font-weight="700">Validation Layer</text>
  <text x="365.0" y="207.5" font-size="10.5" fill="#334155" text-anchor="middle">DL exists? requestor = owner?</text>
  <rect x="510" y="120" width="230" height="150" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="625.0" y="156.5" font-size="14" fill="#92400e" text-anchor="middle" font-weight="700">Approval Engine</text>
  <text x="625.0" y="173.5" font-size="10.5" fill="#92400e" text-anchor="middle">only when requestor is</text>
  <text x="625.0" y="190.5" font-size="10.5" fill="#92400e" text-anchor="middle">NOT the DL owner</text>
  <text x="625.0" y="207.5" font-size="6" fill="#92400e" text-anchor="middle"></text>
  <text x="625.0" y="224.5" font-size="10.5" fill="#92400e" text-anchor="middle">owner's request -&gt;</text>
  <text x="625.0" y="241.5" font-size="10.5" fill="#92400e" text-anchor="middle">skips straight through</text>
  <rect x="780" y="150" width="200" height="90" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="880.0" y="190.5" font-size="13" fill="#14532d" text-anchor="middle" font-weight="700">Microsoft Graph API</text>
  <text x="880.0" y="207.5" font-size="10.5" fill="#14532d" text-anchor="middle" font-family="monospace">/groups/{id}/members</text>
  <rect x="1020" y="150" width="140" height="90" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="1090.0" y="190.5" font-size="13" fill="#14532d" text-anchor="middle" font-weight="700">Azure Entra ID</text>
  <text x="1090.0" y="207.5" font-size="11" fill="#14532d" text-anchor="middle">M365 Group</text>
  <line x1="220" y1="195" x2="258" y2="195" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="470" y1="195" x2="508" y2="195" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="740" y1="195" x2="778" y2="195" stroke="#d97706" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <line x1="980" y1="195" x2="1018" y2="195" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <text x="40" y="350" font-size="13" font-weight="700" fill="#0f172a">Owner requests run instantly</text>
  <text x="40" y="372" font-size="12" fill="#334155">If the requestor already owns the distribution list, the add/remove executes directly --</text>
  <text x="40" y="392" font-size="12" fill="#334155">no approval step, no wait.</text>
  <text x="40" y="436" font-size="13" font-weight="700" fill="#0f172a">Everyone else waits on the owner</text>
  <text x="40" y="458" font-size="12" fill="#334155">Any other requestor's change is routed to the DL owner for approval first. Creation follows</text>
  <text x="40" y="478" font-size="12" fill="#334155">the same validation pattern: name-uniqueness check, then owners/members collected and confirmed.</text>

  <!-- Footer -->
  <line x1="40" y1="508" x2="1140" y2="508" stroke="#e2e8f0" stroke-width="1"/>
  <text x="40" y="530" font-size="11" fill="#94a3b8">Work Buddy · workflows/dl-management/architecture.svg</text>
</svg>
