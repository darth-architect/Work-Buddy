<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9333ea"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="560" fill="#ffffff"/>

  <text x="40" y="44" font-size="22" font-weight="700" fill="#0f172a">Salesforce Lead &amp; Quota Lookup — Architecture</text>
  <text x="40" y="68" font-size="13" fill="#64748b">Slack · LangGraph agent · MCP Salesforce tool server · SOQL</text>

  <rect x="60" y="150" width="190" height="90" rx="12" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
  <text x="155.0" y="190.5" font-size="16" fill="#0c4a6e" text-anchor="middle" font-weight="700">Slack</text>
  <text x="155.0" y="207.5" font-size="10.5" fill="#0c4a6e" text-anchor="middle">“show me my leads”</text>
  <rect x="320" y="150" width="230" height="90" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <text x="435.0" y="190.5" font-size="14" fill="#581c87" text-anchor="middle" font-weight="700">LangGraph Agent</text>
  <text x="435.0" y="207.5" font-size="11" fill="#581c87" text-anchor="middle">Tier 2 — runs instantly</text>
  <rect x="620" y="150" width="230" height="90" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="735.0" y="190.5" font-size="13" fill="#14532d" text-anchor="middle" font-weight="700">MCP · Salesforce</text>
  <text x="735.0" y="207.5" font-size="11" fill="#14532d" text-anchor="middle" font-family="monospace">SOQL via REST</text>
  <rect x="920" y="150" width="200" height="90" rx="12" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
  <text x="1020.0" y="182.0" font-size="14" fill="#0c4a6e" text-anchor="middle" font-weight="700">Slack reply</text>
  <text x="1020.0" y="199.0" font-size="11" fill="#0c4a6e" text-anchor="middle">every matching record</text>
  <text x="1020.0" y="216.0" font-size="11" fill="#0c4a6e" text-anchor="middle">listed in full</text>
  <line x1="250" y1="195" x2="318" y2="195" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="550" y1="195" x2="618" y2="195" stroke="#9333ea" stroke-width="2" marker-end="url(#arrowPurple)"/>
  <line x1="850" y1="195" x2="918" y2="195" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <text x="40" y="350" font-size="13" font-weight="700" fill="#0f172a">Tier 2 — runs instantly, no ticket</text>
  <text x="40" y="372" font-size="12" fill="#334155">Lookups are read-only, so there's no governance gate: the agent maps the question to a</text>
  <text x="40" y="392" font-size="12" fill="#334155">SOQL-backed MCP tool and replies in the same thread.</text>
  <text x="40" y="436" font-size="13" font-weight="700" fill="#0f172a">Every matching record, never summarized away</text>
  <text x="40" y="458" font-size="12" fill="#334155">The tool returns the full filtered result set and the agent is instructed to list all of it --</text>
  <text x="40" y="478" font-size="12" fill="#334155">a fix after an earlier version quietly dropped records down to one based on its own judgment.</text>

  <!-- Footer -->
  <line x1="40" y1="508" x2="1140" y2="508" stroke="#e2e8f0" stroke-width="1"/>
  <text x="40" y="530" font-size="11" fill="#94a3b8">Work Buddy · workflows/salesforce-lead-quota-lookup/architecture.svg</text>
</svg>
