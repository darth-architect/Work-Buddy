<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9333ea"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="560" fill="#ffffff"/>

  <text x="40" y="44" font-size="22" font-weight="700" fill="#0f172a">Application Access Provisioning — Architecture</text>
  <text x="40" y="68" font-size="13" fill="#64748b">AI chatbot · manager approval · Okta application assignment</text>

  <rect x="40" y="150" width="180" height="90" rx="12" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
  <text x="130.0" y="190.5" font-size="16" fill="#0c4a6e" text-anchor="middle" font-weight="700">User</text>
  <text x="130.0" y="207.5" font-size="12" fill="#0c4a6e" text-anchor="middle">via AI chatbot</text>
  <rect x="260" y="150" width="220" height="90" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="370.0" y="190.5" font-size="14" fill="#334155" text-anchor="middle" font-weight="700">Request Validation</text>
  <text x="370.0" y="207.5" font-size="10.5" fill="#334155" text-anchor="middle">app match + self/proxy check</text>
  <rect x="520" y="120" width="220" height="150" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="630.0" y="165.0" font-size="14" fill="#92400e" text-anchor="middle" font-weight="700">Manager Approval</text>
  <text x="630.0" y="182.0" font-size="10.5" fill="#92400e" text-anchor="middle">via chatbot, email, or</text>
  <text x="630.0" y="199.0" font-size="10.5" fill="#92400e" text-anchor="middle">integrated approval system</text>
  <text x="630.0" y="216.0" font-size="6" fill="#92400e" text-anchor="middle"></text>
  <text x="630.0" y="233.0" font-size="10" fill="#92400e" text-anchor="middle">rejected -&gt; requestor notified</text>
  <rect x="780" y="150" width="180" height="90" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="870.0" y="190.5" font-size="15" fill="#14532d" text-anchor="middle" font-weight="700">Okta API</text>
  <text x="870.0" y="207.5" font-size="10.5" fill="#14532d" text-anchor="middle" font-family="monospace">POST /apps/{id}/users</text>
  <rect x="1000" y="150" width="150" height="90" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="1075.0" y="190.5" font-size="14" fill="#14532d" text-anchor="middle" font-weight="700">Application</text>
  <text x="1075.0" y="207.5" font-size="11" fill="#14532d" text-anchor="middle">assigned to user</text>
  <line x1="220" y1="195" x2="258" y2="195" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="195" x2="518" y2="195" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="740" y1="195" x2="778" y2="195" stroke="#d97706" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <line x1="960" y1="195" x2="998" y2="195" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <text x="40" y="350" font-size="13" font-weight="700" fill="#0f172a">Self or proxy requests, same flow</text>
  <text x="40" y="372" font-size="12" fill="#334155">A user can request access for themselves or on behalf of someone else -- the bot just</text>
  <text x="40" y="392" font-size="12" fill="#334155">captures the target user's email and validates them in Okta before routing for approval.</text>
  <text x="40" y="436" font-size="13" font-weight="700" fill="#0f172a">Manager approval gates every provisioning call</text>
  <text x="40" y="458" font-size="12" fill="#334155">No application is assigned until the manager approves. Approval and provisioning are two</text>
  <text x="40" y="478" font-size="12" fill="#334155">distinct steps, so a rejection never reaches the Okta API at all.</text>

  <!-- Footer -->
  <line x1="40" y1="508" x2="1140" y2="508" stroke="#e2e8f0" stroke-width="1"/>
  <text x="40" y="530" font-size="11" fill="#94a3b8">Work Buddy · workflows/application-access-provisioning-okta/architecture.svg</text>
</svg>
