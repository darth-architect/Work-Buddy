<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 650" font-family="Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#d97706"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1180" height="650" fill="#ffffff"/>

  <text x="40" y="44" font-size="24" font-weight="700" fill="#0f172a">Work Buddy — System Architecture</text>
  <text x="40" y="68" font-size="14" fill="#64748b">Slack bot · LangGraph agent · MCP tool layer · four connected systems</text>

  <!-- Slack -->
  <rect x="40" y="140" width="190" height="90" rx="12" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
  <text x="135" y="176" font-size="16" font-weight="700" fill="#0c4a6e" text-anchor="middle">Slack</text>
  <text x="135" y="196" font-size="12" fill="#0c4a6e" text-anchor="middle">slack_bolt</text>
  <text x="135" y="212" font-size="12" fill="#0c4a6e" text-anchor="middle">(Socket Mode)</text>

  <!-- Agent -->
  <rect x="320" y="120" width="260" height="130" rx="12" fill="#faf5ff" stroke="#9333ea" stroke-width="2"/>
  <text x="450" y="152" font-size="16" font-weight="700" fill="#581c87" text-anchor="middle">LangGraph Agent</text>
  <text x="450" y="174" font-size="12" fill="#581c87" text-anchor="middle">LangChain + Ollama</text>
  <text x="450" y="192" font-size="12" fill="#581c87" text-anchor="middle" font-family="monospace">granite4.1:8b</text>
  <text x="450" y="212" font-size="11" fill="#7e22ce" text-anchor="middle">runs entirely locally —</text>
  <text x="450" y="228" font-size="11" fill="#7e22ce" text-anchor="middle">no external LLM API</text>

  <!-- Governance gate -->
  <rect x="320" y="290" width="260" height="110" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="450" y="315" font-size="14" font-weight="700" fill="#92400e" text-anchor="middle">Governance Gate</text>
  <text x="340" y="340" font-size="11.5" fill="#92400e">Tier 2 — status checks, unlocks,</text>
  <text x="340" y="355" font-size="11.5" fill="#92400e">lookups → runs instantly</text>
  <text x="340" y="375" font-size="11.5" fill="#92400e">Tier 1 — new accounts, access</text>
  <text x="340" y="390" font-size="11.5" fill="#92400e">grants → JSM ticket + approval first</text>

  <!-- MCP client -->
  <rect x="640" y="120" width="170" height="90" rx="12" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
  <text x="725" y="154" font-size="14" font-weight="700" fill="#14532d" text-anchor="middle">MCP Client</text>
  <text x="725" y="172" font-size="11" fill="#14532d" text-anchor="middle" font-family="monospace">MultiServerMCPClient</text>
  <text x="725" y="190" font-size="10.5" fill="#166534" text-anchor="middle">open protocol, not a</text>
  <text x="725" y="203" font-size="10.5" fill="#166534" text-anchor="middle">vendor-specific API</text>

  <!-- MCP servers swappable box -->
  <rect x="870" y="70" width="270" height="330" rx="14" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="1005" y="96" font-size="12.5" font-weight="700" fill="#166534" text-anchor="middle">MCP TOOL SERVERS</text>
  <text x="1005" y="112" font-size="10.5" fill="#166534" text-anchor="middle">hosted on n8n today — swappable</text>
  <text x="1005" y="126" font-size="10.5" fill="#166534" text-anchor="middle">for Replit / plain Python / serverless</text>

  <!-- 4 system boxes -->
  <rect x="895" y="145" width="220" height="50" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="1005" y="175" font-size="13" fill="#14532d" text-anchor="middle" font-weight="600">Okta</text>

  <rect x="895" y="205" width="220" height="50" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="1005" y="235" font-size="13" fill="#14532d" text-anchor="middle" font-weight="600">Azure AD</text>

  <rect x="895" y="265" width="220" height="50" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="1005" y="295" font-size="13" fill="#14532d" text-anchor="middle" font-weight="600">Salesforce</text>

  <rect x="895" y="325" width="220" height="50" rx="8" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="1005" y="355" font-size="13" fill="#14532d" text-anchor="middle" font-weight="600">Jira Service Management</text>

  <!-- arrows: slack <-> agent -->
  <line x1="230" y1="185" x2="312" y2="185" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="312" y1="210" x2="230" y2="210" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="270" y="172" font-size="9.5" fill="#64748b" text-anchor="middle">message</text>
  <text x="270" y="228" font-size="9.5" fill="#64748b" text-anchor="middle">reply</text>

  <!-- agent -> governance -->
  <line x1="450" y1="250" x2="450" y2="288" stroke="#d97706" stroke-width="2" marker-end="url(#arrowAmber)"/>

  <!-- agent -> mcp client -->
  <line x1="580" y1="170" x2="638" y2="165" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreen)"/>
  <text x="608" y="155" font-size="9.5" fill="#15803d" text-anchor="middle">tool call</text>

  <!-- mcp client -> servers -->
  <line x1="810" y1="165" x2="893" y2="165" stroke="#16a34a" stroke-width="2" marker-end="url(#arrowGreen)"/>

  <!-- governance -> mcp client (tier1 provision path) -->
  <path d="M580 345 C 640 345, 660 280, 660 215" fill="none" stroke="#d97706" stroke-width="2" marker-end="url(#arrowAmber)"/>
  <text x="700" y="340" font-size="9.5" fill="#92400e">approved Tier 1 →</text>
  <text x="700" y="353" font-size="9.5" fill="#92400e">provision</text>

  <!-- Local model note -->
  <rect x="40" y="290" width="230" height="70" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="155" y="315" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">Local, not cloud</text>
  <text x="155" y="334" font-size="10.5" fill="#475569" text-anchor="middle">Ollama runs on local hardware —</text>
  <text x="155" y="348" font-size="10.5" fill="#475569" text-anchor="middle">no conversation data leaves it.</text>

  <!-- Legend -->
  <text x="40" y="460" font-size="13" font-weight="700" fill="#0f172a">Platform-agnostic by design</text>
  <text x="40" y="484" font-size="12" fill="#334155">The agent (purple) is ordinary LangGraph/LangChain Python — it has no n8n-specific code.</text>
  <text x="40" y="504" font-size="12" fill="#334155">Everything inside the dashed green box could be re-hosted (Replit, a plain Python service,</text>
  <text x="40" y="524" font-size="12" fill="#334155">serverless) without changing a line of agent code — swapping the MCP server is all it takes.</text>

  <text x="40" y="568" font-size="13" font-weight="700" fill="#0f172a">Governance travels with the action, not the user</text>
  <text x="40" y="592" font-size="12" fill="#334155">Every tool is tagged Tier 1 or Tier 2. The agent checks the tag before acting — sensitive</text>
  <text x="40" y="612" font-size="12" fill="#334155">actions always go through a ticket and approval, everyday ones never wait on one.</text>

  <!-- Footer -->
  <line x1="40" y1="610" x2="1140" y2="610" stroke="#e2e8f0" stroke-width="1"/>
  <text x="40" y="632" font-size="11" fill="#94a3b8">Work Buddy · architecture/system-architecture.svg</text>
</svg>
